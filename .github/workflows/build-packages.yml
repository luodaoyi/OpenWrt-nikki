name: Build Nikki for QWRT A73

on:
  workflow_dispatch:
  push:
    branches:
      - qwrt-a73
    paths:
      - .github/workflows/build-packages.yml
      - .github/scripts/qwrt-run/**
      - mihomo-meta/**
      - nikki/**
      - luci-app-nikki/**

permissions:
  contents: write

concurrency:
  group: nikki-qwrt-a73-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_ARCH: aarch64_cortex-a53
  SDK_VERSION: 24.10.6
  ROUTER_ARCH: aarch64_cortex-a73_neon-vfpv4

jobs:
  build:
    name: Mihomo + Nikki + LuCI zh-cn
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Read package versions
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "mihomo_version=$(sed -n 's/^PKG_VERSION:=//p' mihomo-meta/Makefile)" >> "$GITHUB_OUTPUT"
          echo "nikki_version=$(sed -n 's/^PKG_VERSION:=//p' nikki/Makefile)" >> "$GITHUB_OUTPUT"
          echo "nikki_release=$(sed -n 's/^PKG_RELEASE:=//p' nikki/Makefile)" >> "$GITHUB_OUTPUT"
          echo "luci_version=$(sed -n 's/^PKG_VERSION:=//p' luci-app-nikki/Makefile)" >> "$GITHUB_OUTPUT"

      - name: Build packages
        uses: openwrt/gh-action-sdk@797d0e3d0eb13b355c3447f60d0179d4b43089e2
        env:
          ARCH: ${{ env.SDK_ARCH }}-${{ env.SDK_VERSION }}
          FEEDNAME: nikki
          PACKAGES: mihomo-meta nikki luci-app-nikki
          NO_REFRESH_CHECK: true

      - name: Collect and verify packages
        env:
          MIHOMO_VERSION: ${{ steps.metadata.outputs.mihomo_version }}
          NIKKI_VERSION: ${{ steps.metadata.outputs.nikki_version }}
          NIKKI_RELEASE: ${{ steps.metadata.outputs.nikki_release }}
          LUCI_VERSION: ${{ steps.metadata.outputs.luci_version }}
        shell: bash
        run: |
          set -xeuo pipefail
          package_dir="bin/packages/${SDK_ARCH}/nikki"
          test -d "$package_dir"
          ls -l "$package_dir"

          shopt -s nullglob
          mihomo_packages=("$package_dir"/mihomo-meta_*.ipk)
          nikki_packages=("$package_dir"/nikki_*.ipk)
          luci_packages=("$package_dir"/luci-app-nikki_*.ipk)
          language_packages=("$package_dir"/luci-i18n-nikki-zh-cn_*.ipk)
          test "${#mihomo_packages[@]}" -eq 1
          test "${#nikki_packages[@]}" -eq 1
          test "${#luci_packages[@]}" -eq 1
          test "${#language_packages[@]}" -eq 1

          package_control() {
            tar -xOzf "$1" ./control.tar.gz | tar -xzO ./control
          }

          mihomo_control="$(package_control "${mihomo_packages[0]}")"
          nikki_control="$(package_control "${nikki_packages[0]}")"
          luci_control="$(package_control "${luci_packages[0]}")"
          language_control="$(package_control "${language_packages[0]}")"

          grep -Fx "Package: mihomo-meta" <<< "$mihomo_control"
          grep -Fx "Architecture: $SDK_ARCH" <<< "$mihomo_control"
          grep -Fx "Package: nikki" <<< "$nikki_control"
          grep -Fx "Architecture: $SDK_ARCH" <<< "$nikki_control"
          if grep -Fq "kmod-dummy" <<< "$nikki_control"; then
            echo "nikki package still has a hard kmod-dummy dependency" >&2
            exit 1
          fi
          grep -Fx "Package: luci-app-nikki" <<< "$luci_control"
          grep -Fx "Architecture: all" <<< "$luci_control"
          grep -Fx "Package: luci-i18n-nikki-zh-cn" <<< "$language_control"
          grep -Fx "Architecture: all" <<< "$language_control"
          tar -xOzf "${language_packages[0]}" ./data.tar.gz \
            | tar -tz \
            | grep -Fx "./usr/lib/lua/luci/i18n/nikki.zh-cn.lmo"

          mkdir -p dist
          cp "${mihomo_packages[0]}" \
            "${nikki_packages[0]}" \
            "${luci_packages[0]}" \
            "${language_packages[0]}" \
            dist/

          cat > dist/BUILD_INFO.txt <<EOF
          mihomo_version=$MIHOMO_VERSION
          nikki_version=$NIKKI_VERSION
          nikki_release=$NIKKI_RELEASE
          luci_version=$LUCI_VERSION
          source_commit=$GITHUB_SHA
          sdk_arch=$SDK_ARCH
          sdk_version=$SDK_VERSION
          package_arch=$SDK_ARCH
          router_arch=$ROUTER_ARCH
          fake_ip6_dummy_dependency=runtime-conditional
          EOF
          (
            cd dist
            sha256sum ./*.ipk BUILD_INFO.txt > SHA256SUMS
          )
          ls -l dist

      - name: Build self-extracting installer
        id: run_package
        env:
          MIHOMO_VERSION: ${{ steps.metadata.outputs.mihomo_version }}
          NIKKI_VERSION: ${{ steps.metadata.outputs.nikki_version }}
          NIKKI_RELEASE: ${{ steps.metadata.outputs.nikki_release }}
        shell: bash
        run: |
          set -euo pipefail
          run_name="OpenWrt-nikki-${NIKKI_VERSION}-r${NIKKI_RELEASE}-mihomo-${MIHOMO_VERSION}-QWRT-A73.run"
          bash .github/scripts/qwrt-run/build.sh dist "$run_name"
          echo "name=$run_name" >> "$GITHUB_OUTPUT"
          ls -lh "dist/$run_name" "dist/$run_name.sha256"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nikki-mihomo-${{ steps.metadata.outputs.mihomo_version }}-qwrt-a73
          path: dist
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          MIHOMO_VERSION: ${{ steps.metadata.outputs.mihomo_version }}
          NIKKI_VERSION: ${{ steps.metadata.outputs.nikki_version }}
          NIKKI_RELEASE: ${{ steps.metadata.outputs.nikki_release }}
          RUN_NAME: ${{ steps.run_package.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          tag="qwrt-a73-nikki-${NIKKI_VERSION}-r${NIKKI_RELEASE}-${short_sha}"
          title="Nikki ${NIKKI_VERSION}-r${NIKKI_RELEASE} for QWRT A73"
          notes_file=$(mktemp)
          trap 'rm -f "$notes_file"' EXIT
          cat > "$notes_file" <<EOF
          Automated QWRT A73 build from commit ${GITHUB_SHA}.

          - Nikki: ${NIKKI_VERSION}-r${NIKKI_RELEASE}
          - Mihomo Meta: ${MIHOMO_VERSION}
          - Router architecture: ${ROUTER_ARCH}
          - Package ABI: ${SDK_ARCH} (compatible with this QWRT image)
          - Fake-IP6: kmod-dummy is optional and checked at runtime

          Use ${RUN_NAME} --verify to verify the embedded payload or run it as root to install.
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file "$notes_file"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file "$notes_file"
          fi
          gh release upload "$tag" dist/* --clobber
          gh release view "$tag" --json url --jq '.url'
